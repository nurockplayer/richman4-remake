name: Isolated Godot MCP PoC (no production adoption)
on:
  push:
    branches:
      - experiment/godot-mcp-poc-20261015
permissions:
  contents: read
jobs:
  probe:
    name: Godot 4.7.2 vs Coding-Solo MCP
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GODOT_PATH: /usr/local/bin/godot
      DEBUG: 'false'
    steps:
      - name: Read-only credential-free checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node for disposable published MCP
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact repo-pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  /tmp/godot.zip' | sha512sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Existing direct Godot baseline (THIN, no assets)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import
          godot --headless --path . --script tests/calendar.gd
          godot --headless --path . --script tests/graph_flow.gd
          echo 'RESULT: direct Godot 4.7.2 baseline PASS'
      - name: Published Coding-Solo MCP handshake and scratch scene
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm --version
          node .github/poc-godot-mcp.mjs

      - name: Agent Loop 3.0.1 live click UI and screenshot (Xvfb, scratch only)
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          command -v xvfb-run
          xvfb-run -a -s "-screen 0 1280x720x24" node .github/poc-agent-loop.mjs
